services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: bim
      POSTGRES_USER: bim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bim}
    ports: ["127.0.0.1:5432:5432"]   # 호스트 로컬만. 외부 노출은 web 뿐
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bim -d bim"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 버킷 1회 생성 후 종료
  minio-init:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio123} &&
             mc mb --ignore-existing local/bim &&
             mc anonymous set download local/bim/glb"   # glb 만 공개 읽기, source.ifc 는 비공개

  api:
    build: ./api
    environment:
      DB_HOST: postgis
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bim}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10


  ifc-worker:
    build: ./ifc-worker
    environment:
      DB_HOST: postgis
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bim}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      # GEOM_THREADS: 4   # 기하 변환 스레드. 스레드당 ~200MB
    depends_on:
      api: { condition: service_healthy }


  web:
    build: ./web
    ports: ["5173:80"]
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}         # 둘 다 채우면 화면·API 에 Basic 인증 (외부 데모 배포용). 비우면 열림
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      DEMO_PUBLIC: ${DEMO_PUBLIC:-}                 # 1 이면 공개 데모 — 업로드·삭제 등 파괴적 쓰기 403 (web/docker-entrypoint.d/20-demo-public.sh)
    depends_on:
      api: { condition: service_healthy }

  # ── 공개 데모 (docker compose --profile demo up -d) ─────────────────────────
  # BMS 시뮬레이터 상시 구동: 감지기 8개 풀·10초 간격. 모델은 이름으로 찾는다(재업로드로 id 가 바뀌어도 그대로)
  sim:
    profiles: [demo]
    image: python:3.13-alpine   # 표준 라이브러리만 — 워커 이미지(ifcopenshell) 빌드 불필요
    entrypoint: ["python", "-u", "/gen/bms_sim.py"]
    command: ["--name", "mep-building.ifc", "--api", "http://api:8080/api", "--interval", "10", "--pool", "8"]
    volumes: ["./samples/gen:/gen:ro"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # Cloudflare quick tunnel: 계정 없이 https://*.trycloudflare.com 임의 URL → web. URL 은 `docker compose logs tunnel | grep trycloudflare`
  # 외부 공개 전 .env 에 DEMO_PUBLIC=1 (필요하면 BASIC_AUTH_*) 를 먼저 둘 것
  tunnel:
    profiles: [demo]
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:80"]
    depends_on: [web]
    restart: unless-stopped

volumes:
  pgdata:
  minio:
