services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: bim
      POSTGRES_USER: bim
      POSTGRES_PASSWORD: bim
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bim -d bim"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 버킷 1회 생성 후 종료
  minio-init:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minio minio123 &&
             mc mb --ignore-existing local/bim"

  api:
    build: ./api
    environment:
      DB_HOST: postgis
      S3_ENDPOINT: http://minio:9000
    ports: ["8080:8080"]
    depends_on:
      postgis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10


  ifc-worker:
    build: ./ifc-worker
    environment:
      DB_HOST: postgis
      S3_ENDPOINT: http://minio:9000
    depends_on:
      api: { condition: service_healthy }


  web:
    build: ./web
    ports: ["5173:80"]
    depends_on:
      api: { condition: service_healthy }


volumes:
  pgdata:
  minio:
