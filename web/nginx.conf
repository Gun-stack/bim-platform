# 외부 배포 시 이 컨테이너만 노출한다(compose 에서 api·postgis·minio 는 127.0.0.1 바인딩). TLS 는 앞단 리버스 프록시/로드밸런서 몫.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;   # IP 당 API 20 req/s, 버스트 40 (뷰어 초기 로드가 5~6 요청)

server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 500m;   # IFC 업로드 상한. api 와 동일 값
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  gzip on; gzip_types application/json text/javascript application/javascript text/css; gzip_min_length 1024;   # 2만 요소 목록 2.5MB → ~300KB
  types { text/javascript mjs; }   # MapLibre 모듈 워커(.mjs). 기본 mime.types 엔 없어 octet-stream 이 되고 워커가 조용히 죽는다
  include /etc/nginx/mime.types;

  location / { try_files $uri /index.html; }

  location /api/ {
    limit_req zone=api burst=40 nodelay; limit_req_status 429;
    proxy_pass http://api:8080/api/;
    proxy_request_buffering off;   # 대용량 업로드 스트리밍
    proxy_read_timeout 300s;       # SSE
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location /files/bim/glb/ {      # glb 만(api 의 glbUrl = /files/{bucket}/{glbKey}). source.ifc(models/…) 는 프록시 자체를 안 열어 버킷 정책과 이중 차단
    proxy_pass http://minio:9000/bim/glb/;
  }
  location /actuator/ { return 404; }
}
