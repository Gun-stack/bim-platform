# 외부 배포 시 이 컨테이너만 노출한다(compose 에서 api·postgis·minio 는 127.0.0.1 바인딩). TLS 는 앞단 리버스 프록시/로드밸런서 몫.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;   # IP 당 API 20 req/s, 버스트 40 (뷰어 진입 15~17 요청)

# 터널 컨테이너(compose 내부망)에서 오는 요청은 CF-Connecting-IP 로 실제 방문자 IP 를 복원해 레이트 리밋에 반영 — 헤더 없으면 지금과 동일
# ponytail: 이 사설 대역 전체를 신뢰하므로 대역 안의 아무 클라이언트나 CF-Connecting-IP 를 지어내 레이트 리밋 회피·로그 조작 가능 — 이 Docker Desktop 호스트는 host/LAN 트래픽이 고정 NAT IP(185.199.110.133)로 들어와 당장은 안전하지만, Linux 호스트나 web 을 127.0.0.1 밖에 바인딩하면 위험. 업그레이드: compose 에 고정 서브넷 + tunnel 컨테이너에 ipv4_address 고정 → 그 /32 만 신뢰
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 1m;   # 업로드 전용 location 만 500m 로 별도 지정(아래) — 그 외 전 경로는 1MB 상한
  include /etc/nginx/conf.d/auth.inc;   # BASIC_AUTH_USER/PASSWORD 가 있으면 Basic 인증 (docker-entrypoint.d/10-basic-auth.sh 가 생성)
  include /etc/nginx/conf.d/demo.inc;   # DEMO_PUBLIC=1 이면 GET /api/config → {"demo":true}, 꺼져 있으면 {"demo":false} (20-demo-public.sh 가 생성)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  gzip on; gzip_types application/json text/javascript application/javascript text/css model/gltf-binary; gzip_min_length 1024; gzip_proxied any;   # 2만 요소 목록 2.5MB → ~300KB. glb 도 36MB → 5MB (Clinic HVAC) — 프록시 응답(minio)이라 gzip_proxied 필요
  types { text/javascript mjs; }   # MapLibre 모듈 워커(.mjs). 기본 mime.types 엔 없어 octet-stream 이 되고 워커가 조용히 죽는다
  include /etc/nginx/mime.types;

  # index.html 은 매번 재검증(배포 직후 옛 번들을 계속 쓰는 문제), 해시 붙은 assets 는 1년 캐시. add_header 는 location 에 하나라도 있으면 상위 것을 상속 안 해 보안 헤더를 다시 쓴다
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-Content-Type-Options nosniff always; }
  location / { try_files $uri /index.html; }

  location /api/ {
    if ($uri ~ ";") { return 400; }   # 경로 파라미터(;)로 데모 차단 map($uri 정규식)을 우회하는 것 방지 — 데모 여부와 무관하게 항상 적용. %3B 도 디코드되어 여기 걸린다
    limit_req zone=api burst=40 nodelay; limit_req_status 429;
    if ($demo_block) { add_header Content-Type application/json always; return 403 '{"message":"공개 데모에서는 막힌 동작입니다 (업로드·삭제)"}'; }   # 20-demo-public.sh 의 map. return 만 쓰는 if 라 안전
    proxy_pass http://api:8080/api/;
    proxy_request_buffering off;   # 대용량 업로드 스트리밍
    proxy_read_timeout 300s;       # SSE
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location ~ "^/api/projects/[^/;]+/models$" {   # 패턴에 ; 가 있어 따옴표 필수(nginx 는 안 묶은 토큰의 ; 를 문장 끝으로 봄). IFC 업로드(실제론 GET 목록·POST 생성만 Spring 이 서비스하지만 500MB 캡은 이 경로의 모든 메서드에 적용). pid 세그먼트도 [^/;]+ 로 ; 금지 — /api/projects/{pid};x/models 처럼 pid 안에 ; 가 섞여도 이 정규식에 안 걸려 위 /api/ 로 빠지고 거기서 400(끝에 ;x 가 붙는 /models;x 도 동일). proxy_pass 에 URI 가 없어 원본 요청 URI 를 그대로 전달 — 기존 /api/ location 의 proxy 설정 복제
    client_max_body_size 500m;
    limit_req zone=api burst=40 nodelay; limit_req_status 429;
    if ($demo_block) { add_header Content-Type application/json always; return 403 '{"message":"공개 데모에서는 막힌 동작입니다 (업로드·삭제)"}'; }
    proxy_pass http://api:8080;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location /files/bim/glb/ {      # glb 만(api 의 glbUrl = /files/{bucket}/{glbKey}). source.ifc(models/…) 는 프록시 자체를 안 열어 버킷 정책과 이중 차단
    proxy_pass http://minio:9000/bim/glb/;
  }
  location /actuator/ { return 404; }
}
